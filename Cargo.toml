[package]
name = "jail"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Run Claude Code and Codex CLI inside Apple containers"
license = "MIT"
default-run = "jail"

[dependencies]
anyhow = "=1.0.100"
clap = { version = "=4.5.40", features = ["derive"] }
fs2 = "=0.4.3"
libc = "=0.2.175"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
signal-hook = { version = "=0.3.18", features = ["extended-siginfo"] }
toml = "=0.8.23"
toml_edit = "=0.22.27"

[dev-dependencies]
tempfile = "=3.20.0"

[[bin]]
name = "jail-guest"
path = "src/bin/jail-guest.rs"

[profile.release]
lto = "thin"
strip = true
